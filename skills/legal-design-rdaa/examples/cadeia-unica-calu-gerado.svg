<text x="42" y="32" font-size="19" font-weight="800" fill="#000000" letter-spacing="0.5">CADEIA ÚNICA</text>
<text x="42" y="49" font-size="11" font-weight="700" fill="#63666A" letter-spacing="1.3">FLUXO E RESPONSABILIDADES NA OPERAÇÃO DE LEITE</text>
<rect x="24" y="62" width="198.4" height="20" rx="3" fill="#63666A"/>
<text x="123.2" y="76" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AUTOR (PRODUTOR)</text>
<rect x="222.4" y="62" width="198.4" height="20" rx="3" fill="#63666A"/>
<text x="321.6" y="76" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">APROLI</text>
<rect x="420.8" y="62" width="198.4" height="20" rx="3" fill="#F7A800"/>
<text x="520.0" y="76" font-size="9" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="1">APROLI → RÉ (CALU)</text>
<rect x="619.2" y="62" width="198.4" height="20" rx="3" fill="#F7A800"/>
<text x="718.4000000000001" y="76" font-size="9" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="1">RÉ (CALU) → APROLI</text>
<rect x="817.6" y="62" width="198.4" height="20" rx="3" fill="#63666A"/>
<text x="916.8000000000001" y="76" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">APROLI → AUTOR</text>
