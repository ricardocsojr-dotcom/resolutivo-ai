<rect x="24" y="92" width="198.4" height="4" rx="2" fill="#63666A"/>
<circle cx="41" cy="116" r="12" fill="#F7A800"/>
<text x="41" y="120.3" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="60" y="112" font-size="10.5" font-weight="800" fill="#000000">FORNECIMENTO
INDIVIDUAL</text>
<text font-size="9" fill="#2b2b2b">
<tspan x="38" y="134">O Autor entrega o leite por
meio da APROLI, sem
contratar diretamente com a Ré.</tspan>
</text>
<line x1="38" y1="178" x2="208.4" y2="178" stroke="#EDEEEF" stroke-width="1"/>
